    <script>

        function csvToJson(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());

            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                const obj = {};
                headers.forEach((h, i) => obj[h] = values[i] || "");
                return obj;
            });
        }


        // FOR RESEARCH PROJECTS
        async function loadResearchForPreview() {
            try {
                const response = await fetch(
                    'https://docs.google.com/spreadsheets/d/e/2PACX-1vQHDOQ6ZpNqGHqt0xVEMF3OABfSSfOHlim9CE23kIQwl9c3S6vgDNjv6pV7yy2xfnF9ureX8NrMyNq4/pub?gid=338810743&single=true&output=csv'
                );

                const csv = await response.text();
                const research = csvToJson(csv);

                // Sort by date descending (newest first)
                research.sort((a, b) => new Date(b.date) - new Date(a.date));

                const recentResearch = research;

                const grid = document.getElementById('research-preview-grid');
                grid.innerHTML = '';

                recentResearch.forEach(item => {
                    const researchCard = document.createElement('div');
                    researchCard.className = 'research-card';

                    if (item.link === 'Classified') {
                        researchCard.innerHTML = `
                    <h3>${item.title}</h3>
                <p class="research-date">Published: ${item.date}</p>
                    <p>${item.excerpt}</p>
                    <a><button>Classified</button></a>
                `;
                    } else {
                        researchCard.innerHTML = `
                    <h3>${item.title}</h3>
                <p class="research-date">Published: ${item.date}</p>
                    <p>${item.excerpt}</p>
                    <a href="${item.link}" target="_blank">
                        <button>Read More</button>
                    </a>
                `;
                    }

                    grid.appendChild(researchCard);
                });

            } catch (error) {
                console.error('Error loading research projects:', error);
            }
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadResearchForPreview);

    </script>
</body>
